<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penny Wise | Grocery Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --secondary: #a855f7;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --accent: #22d3ee;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            padding: 2rem;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
            animation: fadeIn 1s ease-out;
        }

        h1 {
            font-size: 3rem;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .upload-section {
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 2rem;
            text-align: center;
            transition: transform 0.3s ease;
        }

        .upload-section:hover {
            transform: translateY(-5px);
        }

        .drop-zone {
            border: 2px dashed var(--primary);
            padding: 2rem;
            border-radius: 0.5rem;
            cursor: pointer;
            margin-bottom: 1rem;
            transition: background 0.3s;
        }

        .drop-zone:hover {
            background: rgba(99, 102, 241, 0.1);
        }

        button {
            background: linear-gradient(to right, var(--primary), var(--secondary));
            color: white;
            border: none;
            padding: 0.8rem 2rem;
            border-radius: 0.5rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.3s;
        }

        button:hover {
            opacity: 0.9;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .bill-card {
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.05);
            animation: slideUp 0.5s ease-out;
        }

        .bill-card h3 {
            color: var(--accent);
            margin-bottom: 0.5rem;
        }

        .bill-card .date {
            font-size: 0.9rem;
            color: #94a3b8;
        }

        .bill-card .total {
            font-size: 1.25rem;
            font-weight: 600;
            margin-top: 1rem;
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        #status {
            margin-top: 1rem;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Penny Wise</h1>
            <p>Track your groceries, watch your savings grow.</p>
        </header>

        <section class="upload-section">
            <div class="drop-zone" id="dropZone">
                <p>Drag & drop receipt image or click to browse</p>
                <input type="file" id="fileInput" hidden accept="image/*">
            </div>
            <button id="uploadBtn">Upload & Extract</button>
            <div id="status"></div>
        </section>

        <section>
            <h2 style="margin-bottom: 1.5rem;">Recent Bills</h2>
            <div class="grid" id="billGrid">
                <!-- Bills will be loaded here -->
            </div>
        </section>
    </div>

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const uploadBtn = document.getElementById('uploadBtn');
        const status = document.getElementById('status');
        const billGrid = document.getElementById('billGrid');

        dropZone.onclick = () => fileInput.click();

        uploadBtn.onclick = async () => {
            const file = fileInput.files[0];
            if (!file) {
                status.innerText = "Please select a file first.";
                return;
            }

            status.innerText = "Uploading and extracting (using Gemini)...";
            const formData = new FormData();
            formData.append('file', file);

            try {
                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    status.innerText = "Success!";
                    loadBills();
                } else {
                    const err = await response.json();
                    status.innerText = "Error: " + (err.detail || "Failed to upload");
                }
            } catch (e) {
                status.innerText = "Error: " + e.message;
            }
        };

        async function loadBills() {
            try {
                const response = await fetch('/bills');
                const bills = await response.json();
                billGrid.innerHTML = bills.map(bill => `
                    <div class="bill-card">
                        <h3>${bill.store_name}</h3>
                        <p class="date">${bill.bill_date}</p>
                        <p>Items: ${bill.items.length}</p>
                        <span class="total">Total: ₹${bill.grand_total.toFixed(2)}</span>
                    </div>
                `).join('');
            } catch (e) {
                console.error("Failed to load bills", e);
            }
        }

        loadBills();
    </script>
</body>
</html>
